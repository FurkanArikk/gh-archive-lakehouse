services:
  dev:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: gh-lakehouse-dev:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Databricks CLI config and OAuth token cache live in a named volume, not in
      # your home directory, so nothing Databricks-related is written to the host.
      - databricks-auth:/home/dev/.databricks
    env_file:
      - path: .env
        required: false
    environment:
      DATABRICKS_CONFIG_FILE: /home/dev/.databricks/databrickscfg

volumes:
  databricks-auth:
